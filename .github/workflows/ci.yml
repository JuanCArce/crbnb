name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  main:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
            dist
          key: nx-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            nx-${{ github.ref }}-
            nx-main-

      - name: Lint
        run: pnpm nx run-many -t lint

      - name: Test
        run: pnpm nx run-many -t test --coverage=false

      - name: Build affected
        run: pnpm nx affected -t build --base=origin/main --head=HEAD

      - name: E2E (Playwright)
        run: pnpm nx run-many -t e2e --skip-nx-cache || echo "E2E failures allowed for now"
        continue-on-error: true